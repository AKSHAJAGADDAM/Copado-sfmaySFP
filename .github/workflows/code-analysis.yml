name: Salesforce Code Analyzer v5

on:

  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  code-analysis:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # STEP 1 - Checkout Repository
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # STEP 2 - Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ----------------------------------------
      # STEP 3 - Install Salesforce CLI
      # ----------------------------------------
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli


      # ----------------------------------------
      # STEP 4 - Verify Salesforce CLI
      # ----------------------------------------
      - name: Verify Salesforce CLI
        run: |
          sf --version


      # ----------------------------------------
      # STEP 5 - Install Code Analyzer v5
      # ----------------------------------------
      - name: Install Code Analyzer
        run: |
          sf plugins install code-analyzer


      # ----------------------------------------
      # STEP 6 - Verify Code Analyzer
      # ----------------------------------------
      - name: Verify Code Analyzer
        run: |
          sf code-analyzer rules


      # ----------------------------------------
      # STEP 7 - Create Reports Folder
      # ----------------------------------------
      - name: Create Reports Directory
        run: |
          mkdir reports


      # ----------------------------------------
      # STEP 8 - Generate JSON Report
      # ----------------------------------------
      - name: Run JSON Analysis
        run: |
          sf code-analyzer run \
          --workspace force-app \
          --output-file reports/results.json \
          --output-file-format json


      # ----------------------------------------
      # STEP 9 - Generate HTML Report
      # ----------------------------------------
      - name: Run HTML Analysis
        run: |
          sf code-analyzer run \
          --workspace force-app \
          --output-file reports/results.html \
          --output-file-format html


      # ----------------------------------------
      # STEP 10 - Upload Reports
      # ----------------------------------------
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-reports
          path: reports/


      # ----------------------------------------
      # STEP 11 - Validate Violations
      # ----------------------------------------
      - name: Validate Violations
        run: |
          python3 scripts/validate_results.py
name: Salesforce Code Analyzer v5

on:

  push:

    branches:
      - main
      - develop
      - 'feature/**'
      - 'bugfix/**'

    paths:
      - 'src/**'
      - 'force-app/**'
      - 'classes/**'
      - 'triggers/**'
      - 'lwc/**'
      - 'aura/**'


  pull_request:

    branches:
      - main
      - develop


jobs:

  code-analysis:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------
      # STEP 1 - Checkout Repository
      # ----------------------------------------
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ----------------------------------------
      # STEP 2 - Setup Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ----------------------------------------
      # STEP 3 - Setup Java
      # ----------------------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'


      # ----------------------------------------
      # STEP 4 - Install Salesforce CLI
      # ----------------------------------------
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli


      # ----------------------------------------
      # STEP 5 - Verify Salesforce CLI
      # ----------------------------------------
      - name: Verify Salesforce CLI
        run: |
          sf --version


      # ----------------------------------------
      # STEP 6 - Install Code Analyzer
      # ----------------------------------------
      - name: Install Code Analyzer
        run: |
          sf plugins install code-analyzer


      # ----------------------------------------
      # STEP 7 - Verify Code Analyzer
      # ----------------------------------------
      - name: Verify Code Analyzer
        run: |
          sf code-analyzer rules


      # ----------------------------------------
      # STEP 8 - Create Reports Folder
      # ----------------------------------------
      - name: Create Reports Directory
        run: |
          mkdir -p reports


      # ----------------------------------------
      # STEP 9 - Run JSON Analysis
      # ----------------------------------------
      - name: Run JSON Analysis
        run: |
          sf code-analyzer run \
          --workspace . \
          --output-file reports/results.json


      # ----------------------------------------
      # STEP 10 - Run HTML Analysis
      # ----------------------------------------
      - name: Run HTML Analysis
        run: |
          sf code-analyzer run \
          --workspace . \
          --view detail \
          --output-file reports/results.html


      # ----------------------------------------
      # STEP 11 - Upload Reports
      # ----------------------------------------
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-reports
          path: reports/


      # ----------------------------------------
      # STEP 12 - Validate Violations
      # ----------------------------------------
      - name: Validate Violations
        run: |
          python3 scripts/validate_results.py

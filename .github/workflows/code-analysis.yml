name: Salesforce Code Analysis

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:

  code-analysis:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------------
      # STEP 1 - Checkout Repository
      # -----------------------------------
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # -----------------------------------
      # STEP 2 - Install Node.js
      # -----------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # -----------------------------------
      # STEP 3 - Install Salesforce CLI
      # -----------------------------------
      - name: Install Salesforce CLI
        run: |
          npm install -g @salesforce/cli

      # -----------------------------------
      # STEP 4 - Verify Salesforce CLI
      # -----------------------------------
      - name: Verify Salesforce CLI
        run: |
          sf --version

      # -----------------------------------
      # STEP 5 - Install Scanner Plugin
      # -----------------------------------
      - name: Install Salesforce Scanner
        run: |
          sf plugins install @salesforce/sfdx-scanner

      # -----------------------------------
      # STEP 6 - Verify Scanner
      # -----------------------------------
      - name: Verify Scanner
        run: |
          sf scanner --help

      # -----------------------------------
      # STEP 7 - Create Reports Folder
      # -----------------------------------
      - name: Create Reports Directory
        run: |
          mkdir reports

      # -----------------------------------
      # STEP 8 - Generate JSON Report
      # -----------------------------------
      - name: Run JSON Code Analysis
        run: |
          sf scanner run \
          --target "force-app/**" \
          --format json \
          --outfile reports/results.json

      # -----------------------------------
      # STEP 9 - Generate HTML Report
      # -----------------------------------
      - name: Run HTML Code Analysis
        run: |
          sf scanner run \
          --target "force-app/**" \
          --format html \
          --outfile reports/results.html

      # -----------------------------------
      # STEP 10 - Upload Reports
      # -----------------------------------
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        with:
          name: scanner-reports
          path: reports/

      # -----------------------------------
      # STEP 11 - Fail If Violations Exist
      # -----------------------------------
      - name: Validate Violations
        run: |
          python3 scripts/validate_results.py